    type: "article"
    location: "C. R. Acad. Sci. Paris Sér. A-B 281 (1975), 887-890"
    relationship: "background"
    note: "The half-sum identity for odd characters of odd conductor, formula (2)."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the parity of k-th powers modulo p. A generalization of a problem of Lehmer"
    authors:
      - "J. Bourgain"
      - "T. Cochrane"
      - "J. Paulhus"
      - "C. Pinner"
    type: "article"
    location: "Acta Arith. 147 (2011), 173-203"
    relationship: "background"
    note: "Theorem 1.3 gives the untwisted count behind the band weight."
    license: "CC-BY-4.0"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://doi.org/10.5281/zenodo.23624363"
    relationship: "builds-on"
    note: "KSurvey (QuarticSurvey), the formalized survey of the classical facts by the same author. Its files Basic, Pin, FixedBase and CosetSums are copied here, converted to the module system and renamed into the BandParity namespace."

status:
  scope: >-
    Formalized: the matching lemma and its independence of the matching; the existence and
    uniqueness of the quartic character with chi(2) = i; sum chi(n) n = p (k + i t) and the
    oddness of k and t; the parity dictionary; the coset form of f and e; the lag identity; both
    laws of Theorem A; the exact coset parities; the Coordinate Congruence in both forms; and, for
    any odd modulus, the representative identity and the odd-subgroup congruence (Theorem B).
    Not formalized: Dirichlet's identification kappa = h(-4p)/2, which is quoted only to interpret
    kappa, and the finite computation showing that all eight residue patterns modulo 4 occur.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the paper's
        statements and proofs, compiled locally with lake, and checked with Palomar's lake
        comparator script. The mathematics, statements and paper are the author's.
      cost:
        wall_time: "about half a day"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the paper's statements and proofs and asked to formalize them without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope (the Theorem A core and Theorem B, with the completeness computation
    left as a computation) and reviewed the formal statements in Challenge.lean against the paper.

fidelity:
  divergences: >-
    Characters are MulChar (ZMod p) GaussianInt of order 4; the normalization is the hypothesis
    chi 2 = gi with gi = <0, 1> in GaussianInt, and existence and uniqueness of such a character are
    proved separately. Least residues are ZMod.val. kappa is defined as the Legendre sum over
    0 < n < p/4, not as h(-4p)/2. Both laws of Theorem A and the lag identity are proved for every
    p = 5 (mod 8); the real law and the lag identity are proved without the normalization. In Theorem B the subgroup
    is a Subgroup of (ZMod N)ˣ with decidable membership, the coset is the finite set of units u with
    x⁻¹ u in H, the band-parity sum runs over units, and the exponent e is even and nonzero.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The author compared each statement in Challenge.lean with the corresponding result of the
    paper. The definitions in Challenge.lean are copied verbatim from the development and compared
    by Comparator. No external referee has reviewed the paper or the formalization.

