# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "BandParity: the band-parity sum of a quartic character, two laws modulo 4"
  description: >-
    For a prime p = 5 (mod 8) let chi be the quartic Dirichlet character with chi(2) = i, with
    values in the Gaussian integers, and let C(p) = f + i e be the sum of chi(n) (-1)^floor(n^2/p)
    over 0 < n < p/2. The development proves that f = (p-1)/4 (mod 4) and
    e = kappa (mod 4) for every such p, where kappa is the sum of the Legendre symbols (n/p) over
    0 < n < p/4. The mechanism is a matching lemma: for sign functions sigma, tau and a bijection
    pi, the correlation sum sigma(x) tau(pi x) is congruent modulo 4 to the sum of the two
    marginals minus the number of terms, so it does not depend on pi. Along the way it proves the
    parity dictionary (-1)^floor(n^2/p) = s(n) s(n^2) with s(x) = (-1)^<x>, the coset form
    f = sum over the fourth powers H of s(u) s(u^2) and e = the same sum over 2H, the lag identity
    sum over 2H of s(u) s(2u) = kappa exactly, the exact coset parities sum_H s = k + 2t and
    sum_{2H} s = t - 2k where B_{1,chi} = k + i t, and the Coordinate Congruence
    kappa = (p-1)/4 + k + t (mod 4). It also proves the odd-subgroup congruence: for an odd modulus
    N >= 3, a subgroup H of (Z/N)^x of odd order h, a coset X = xH and an even exponent e >= 2, the
    band-parity sum of X and -X over (0, N/2) equals sum over X of s(u) s(u^e) and is congruent to
    h - 2 alpha(X) - 2 alpha(X^e) modulo 4, where alpha counts elements with odd least residue.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A15", "11L40", "11R29", "68V20"]

sources:
  - title: "The band-parity sum of a quartic character: two laws modulo four, formalized in Lean"
    authors:
      - "Joseph S. Farland"
    id: "https://doi.org/10.5281/zenodo.23673418"
    type: "article"
    location: "Preprint, Zenodo, 2026, https://doi.org/10.5281/zenodo.23673419 (v1.0); all versions https://doi.org/10.5281/zenodo.23673418"
    relationship: "formalizes"
    note: >-
      The paper and this formalization have the same author. Lemmas 3.1, 4.1 and 7.1,
      Propositions 2.1(1), 4.2, 5.1 and 6.2, Theorems 6.1 (Theorem A) and 7.2 (Theorem B) and
      Corollary 6.3 are formalized, together with the existence and uniqueness of the pin.
      Proposition 2.1(2), the half-sum identity, is formalized in the development and used in the
      proof of Proposition 6.2. The completeness computation of Section 8 is not formalized.
      On novelty: the inputs are classical (the half-sum identity of Yamamoto and Barkan, the coset
      sums of the quartic Bernoulli number); the Coordinate Congruence is implicit in Setzer's and
      Hudson's quarter counts together with Dirichlet's formula. The author found the band-parity sum
      and the two mod-4 laws nowhere in the literature searched (the parity of k-th powers modulo p,
      the Lehmer problem and its character-twisted variants, Sun's and Petrov-Sun's sine products,
      floor sums attached to class numbers, fractional parts of polynomials modulo p).
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "The coordinates of a quartic L-value: a formalized survey of the classical facts"
    authors:
      - "Joseph S. Farland"
    id: "https://doi.org/10.5281/zenodo.23624516"
    type: "article"
    location: "Preprint, Zenodo, 2026, https://doi.org/10.5281/zenodo.23624516"
    relationship: "background"
    note: "The classical facts about the coordinates k and t of B_{1,chi}; its Lean files Basic, Pin, FixedBase and CosetSums are reused here."
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Sur des sommes de caractères liées aux nombres de classes des corps abéliens imaginaires"
    authors:
